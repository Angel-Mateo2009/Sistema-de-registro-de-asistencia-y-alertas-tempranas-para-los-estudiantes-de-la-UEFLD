<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Unidad Educativa Fiscomisional La Dolorosa</title>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="firebase-app.js"></script>
    <style>
        :root {
            --navy: #0b1e3b;
            --navy-light: #16325c;
            --crimson: #a61c2b;
            --gold: #eab308;
            --gold-hover: #ca8a04;
        }
        /* Corregido: selector universal * en lugar de guion */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body {
            min-height: 100vh;
            min-height: 100dvh; /* Se adapta correctamente cuando aparece el teclado en el celular */
            background: linear-gradient(135deg, var(--navy) 55%, var(--crimson) 55%);
            display: flex; align-items: center; justify-content: center;
            padding: 16px;
        }
        .login-card {
            background: rgba(11, 30, 59, 0.97); color: white; padding: 36px 32px;
            border-radius: 14px; width: 100%; max-width: 420px; text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.45); border: 1px solid rgba(234, 179, 8, 0.35);
        }
        .escudo-login {
            width: 92px; height: 92px; object-fit: cover; border-radius: 14px;
            margin-bottom: 12px; border: 2px solid var(--gold);
            box-shadow: 0 6px 16px rgba(0,0,0,0.4);
        }
        .login-card h1 { font-size: 1.12rem; line-height: 1.35; }
        .login-card h1 span { color: var(--gold); font-size: 1.42rem; display: block; margin-top: 2px; }
        .subtitle { color: #cbd5e1; font-size: 0.85rem; margin: 6px 0 20px; }

        /* SELECTOR DE JORNADA (MATUTINA / VESPERTINA) */
        .jornada-label {
            display: block; text-align: left; font-size: 0.82rem;
            color: #cbd5e1; margin-bottom: 7px; font-weight: 600;
        }
        .jornada-group {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px;
        }
        .jornada-btn {
            background: #1e293b; color: #cbd5e1; border: 1.5px solid #334155;
            padding: 12px 10px; border-radius: 8px; font-size: 0.86rem; font-weight: 700;
            cursor: pointer; transition: 0.2s; display: flex; align-items: center;
            justify-content: center; gap: 6px;
            -webkit-tap-highlight-color: transparent;
        }
        .jornada-btn:hover { border-color: var(--gold); color: white; }
        .jornada-btn.active {
            background: rgba(234, 179, 8, 0.16);
            border-color: var(--gold);
            color: var(--gold);
            box-shadow: 0 0 0 1px var(--gold);
        }

        .form-group { text-align: left; margin-bottom: 14px; }
        .form-group label { display: block; font-size: 0.82rem; margin-bottom: 5px; color: #cbd5e1; }
        .form-group input {
            width: 100%; padding: 11px 12px; border-radius: 6px; border: 1px solid #334155;
            background: #1e293b; color: white; font-size: 16px; /* Evita zoom automático en iPhone/Android */
            outline: none; transition: border-color 0.2s;
        }
        .form-group input:focus {
            border-color: var(--gold);
        }
        .btn-gold {
            width: 100%; margin-top: 8px; background: var(--gold); color: var(--navy);
            border: none; padding: 13px 12px; border-radius: 6px; font-weight: 800;
            cursor: pointer; font-size: 0.92rem; letter-spacing: 0.3px;
            transition: background 0.2s, transform 0.1s;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-gold:hover { background: var(--gold-hover); }
        .btn-admin {
            width: 100%; margin-top: 12px; background: transparent; color: #e2e8f0;
            border: 1px solid #64748b; padding: 11px 12px; border-radius: 6px;
            font-weight: 700; cursor: pointer; font-size: 0.88rem;
        }
        .btn-admin:hover { border-color: var(--gold); color: white; }
        .btn-gold:active { transform: scale(0.99); }
        .error-msg { color: #fca5a5; font-size: 0.85rem; margin-top: 12px; display: none; }

        /* =========================================================
           ADAPTACIÓN PARA PANTALLAS DE CELULAR
           ========================================================= */
        @media (max-width: 480px) {
            body {
                padding: 12px;
                background: linear-gradient(155deg, var(--navy) 52%, var(--crimson) 52%);
            }
            .login-card {
                padding: 26px 20px;
                border-radius: 12px;
            }
            .escudo-login {
                width: 78px;
                height: 78px;
                margin-bottom: 10px;
            }
            .login-card h1 {
                font-size: 0.98rem;
            }
            .login-card h1 span {
                font-size: 1.25rem;
            }
            .subtitle {
                font-size: 0.8rem;
                margin-bottom: 16px;
            }
            .jornada-btn {
                padding: 11px 6px;
                font-size: 0.8rem;
            }
            .btn-gold {
                font-size: 0.86rem;
                padding: 13px 8px;
            }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <img src="uefld.webp" alt="Escudo U.E.F. La Dolorosa" class="escudo-login">
        <h1>UNIDAD EDUCATIVA FISCOMISIONAL<span>"LA DOLOROSA"</span></h1>
        <p class="subtitle">Control de Asistencia y Alertas Tempranas</p>

        <form id="login-form">
            <span class="jornada-label">Seleccione la Jornada:</span>
            <div class="jornada-group">
                <button type="button" class="jornada-btn active" id="btn-matutina" onclick="seleccionarJornada('Matutina')">
                    MATUTINA
                </button>
                <button type="button" class="jornada-btn" id="btn-vespertina" onclick="seleccionarJornada('Vespertina')">
                    VESPERTINA
                </button>
            </div>

            <button type="submit" class="btn-gold">ENTRAR A LA APP · MATUTINA</button>
        </form>
        <button type="button" id="admin-entry" class="btn-admin">Acceso de administración con Google</button>
        <button type="button" id="export-local" class="btn-admin">Exportar respaldo guardado en este navegador</button>
        <p class="error-msg" id="error-msg"></p>
    </div>

    <script>
        let jornadaSeleccionada = 'Matutina';

        function seleccionarJornada(jornada) {
            jornadaSeleccionada = jornada;
            document.getElementById('btn-matutina').classList.toggle('active', jornada === 'Matutina');
            document.getElementById('btn-vespertina').classList.toggle('active', jornada === 'Vespertina');
            document.querySelector('.btn-gold').textContent = `ENTRAR A LA APP · ${jornada.toUpperCase()}`;
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            localStorage.setItem('uefld_jornada', jornadaSeleccionada);
            window.location.href = 'cursos.html';
        });

        document.getElementById('admin-entry').addEventListener('click', async () => {
            const error = document.getElementById('error-msg');
            try {
                await AlertasFirebase.signInAdmin();
                localStorage.setItem('uefld_jornada', jornadaSeleccionada);
                window.location.href = 'dashboard.html';
            } catch (err) {
                error.textContent = err.message || 'No se pudo iniciar la sesión de administrador.';
                error.style.display = 'block';
            }
        });

        document.getElementById('export-local').addEventListener('click', () => {
            const keys = {
                cursosPorSeccion: 'uefld_cursos_v3', students: 'uefld_students_v3',
                attendanceByDateHour: 'uefld_asistencia_v3', obsByDateHourStudent: 'uefld_obs_por_hora_v3',
                docentesPorHora: 'uefld_docentes_v3', historialGlobal: 'uefld_historial_v3'
            };
            const backup = {};
            Object.entries(keys).forEach(([field, key]) => {
                try { backup[field] = JSON.parse(localStorage.getItem(key)); } catch (_) { backup[field] = null; }
            });
            if (!backup.cursosPorSeccion && !backup.students && !backup.historialGlobal) {
                alert('Este navegador no tiene datos locales para exportar.');
                return;
            }
            const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'respaldo-control-asistencia.json';
            link.click();
            URL.revokeObjectURL(url);
        });
    </script>
</body>
</html>
